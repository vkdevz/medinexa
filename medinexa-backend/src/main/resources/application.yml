server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: medinexa-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/medinexa?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

# Custom configuration properties for security
medinexa:
  security:
    jwt:
      # Base64 encoded secret key (minimum 256 bits / 32 bytes for HS256)
      # This is a development placeholder. Overwrite in production via env var: MEDINEXA_SECURITY_JWT_SECRET
      secret-key: ${MEDINEXA_SECURITY_JWT_SECRET:dGhpcy1pcy1hLXNlY3VyZS1hbmQtc3Ryb25nLWtleS1mb3ItamRjLXNwcmluZy1ib290LTMtdXNpbmctand0LWNyZWRlbnRpYWxzLW9mLW1lZGluZXhh}
      expiration-ms: ${MEDINEXA_SECURITY_JWT_EXPIRATION:86400000} # 24 hours in milliseconds
