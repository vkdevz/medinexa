version: '3.8'

services:
  # ============================================================================
  # DATABASE CONTAINER: MYSQL 8.0
  # ============================================================================
  db:
    image: mysql:8.0
    container_name: velocura-db
    restart: always
    environment:
      MYSQL_DATABASE: velocura_db
      MYSQL_USER: velocura_user
      MYSQL_PASSWORD: velocura_password
      MYSQL_ROOT_PASSWORD: velocura_root_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    # Ensure MySQL is accepting connections before dependant services spin up
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pvelocura_root_password"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # BACKEND SERVICE CONTAINER: SPRING BOOT
  # ============================================================================
  backend:
    build:
      context: ./velocura-backend
      dockerfile: Dockerfile
    container_name: velocura-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      # Connect to the database service container name 'db' on default MySQL port
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/velocura_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: velocura_user
      SPRING_DATASOURCE_PASSWORD: velocura_password
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.MySQLDialect
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      # Inject JWT Secret signing key
      JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    depends_on:
      db:
        condition: service_healthy

  # ============================================================================
  # FRONTEND SERVICE CONTAINER: REACT ON NGINX
  # ============================================================================
  frontend:
    build:
      context: ./velocura-frontend
      dockerfile: Dockerfile
    container_name: velocura-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  db_data:
