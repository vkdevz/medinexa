server:
  port: 8080

spring:
  application:
    name: velocura-backend
  datasource:
    url: ${DB_URL:jdbc:h2:mem:velocura_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

velocura:
  gemini:
    api-key: ${GEMINI_API_KEY:}
  admin:
    email: ${ADMIN_EMAIL:admin@velocura.com}
    password: ${ADMIN_PASSWORD:VeloCuraAdmin_#2026_SecureKey}

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

